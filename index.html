<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Писокоть Великолепный</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: #fff;
}

body {
  font-family: Arial, sans-serif;
}

.slider {
  position: relative;
  width: 100%;
  max-width: 1200px;
  margin: 20px auto;
  overflow: hidden;
  line-height: 0;
}

.slider > img {
  display: block;
  width: 100%;
  height: auto;
}

.after {
  position: absolute;
  top: 0;
  left: 0;
  width: 10%;
  height: 100%;
  overflow: hidden;
}

.after img {
  position: absolute;
  top: 0;
  left: 0;
  display: block;
  width: 100%;
  height: auto;
  max-width: none;
}

.handle {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 10%;
  width: 3px;
  background: #fff;
  transform: translateX(-50%);
  box-shadow: 0 0 6px rgba(0,0,0,.5);
  pointer-events: none;
}

.handle::after {
  content: "↔";
  position: absolute;
  top: 50%;
  left: 50%;
  width: 44px;
  height: 44px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: #fff;
  color: #222;
  font-size: 22px;
  line-height: 44px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,.35);
}

.slider input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  opacity: 0;
  cursor: ew-resize;
}
</style>
</head>

<body>

<div class="slider">

  <img src="original.png" alt="">

  <div class="after">
    <img src="satire.png" alt="">
  </div>

  <div class="handle"></div>

  <input
    type="range"
    min="0"
    max="100"
    value="10"
    aria-label="Сравнить изображения"
  >

</div>

<script>
const slider = document.querySelector(".slider");
const after = slider.querySelector(".after");
const afterImage = after.querySelector("img");
const handle = slider.querySelector(".handle");
const range = slider.querySelector("input");

function setImageSize() {
  afterImage.style.width = slider.clientWidth + "px";
}

function updateSlider(value) {
  after.style.width = value + "%";
  handle.style.left = value + "%";
}

window.addEventListener("load", function () {
  setImageSize();
  updateSlider(range.value);
});

window.addEventListener("resize", function () {
  setImageSize();
});

range.addEventListener("input", function () {
  updateSlider(this.value);
});

setImageSize();
updateSlider(range.value);
</script>

</body>
</html>
