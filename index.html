<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: #fff;
}

.slider {
  position: relative;
  width: 100%;
  max-width: 1200px;
  margin: 20px auto;
  overflow: hidden;
  line-height: 0;
}

.slider > img {
  display: block;
  width: 100%;
  height: auto;
}

.after {
  position: absolute;
  top: 0;
  left: 0;
  width: 10%;
  height: 100%;
  overflow: hidden;
}

.after img {
  position: absolute;
  top: 0;
  left: 0;
  width: 1200px;
  max-width: none;
  height: auto;
}

/* скрываем радиокнопки */
.slider input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

/* вертикальная линия */
.handle {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 3px;
  background: white;
  box-shadow: 0 0 6px rgba(0,0,0,.5);
  pointer-events: none;
}

/* круг */
.handle::after {
  content: "↔";
  position: absolute;
  top: 50%;
  left: 50%;
  width: 44px;
  height: 44px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: white;
  color: #222;
  font-size: 22px;
  line-height: 44px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,.35);
}

/* ПОЛОЖЕНИЯ ПОЛЗУНКА */

/* 10% — начальное положение */
#p10:checked ~ .after {
  width: 10%;
}
#p10:checked ~ .handle {
  left: 10%;
}

/* 15% */
#p15:checked ~ .after {
  width: 15%;
}
#p15:checked ~ .handle {
  left: 15%;
}

/* 20% */
#p20:checked ~ .after {
  width: 20%;
}
#p20:checked ~ .handle {
  left: 20%;
}

/* 25% */
#p25:checked ~ .after {
  width: 25%;
}
#p25:checked ~ .handle {
  left: 25%;
}

/* 30% */
#p30:checked ~ .after {
  width: 30%;
}
#p30:checked ~ .handle {
  left: 30%;
}

/* 35% */
#p35:checked ~ .after {
  width: 35%;
}
#p35:checked ~ .handle {
  left: 35%;
}

/* 40% */
#p40:checked ~ .after {
  width: 40%;
}
#p40:checked ~ .handle {
  left: 40%;
}

/* 45% */
#p45:checked ~ .after {
  width: 45%;
}
#p45:checked ~ .handle {
  left: 45%;
}

/* 50% */
#p50:checked ~ .after {
  width: 50%;
}
#p50:checked ~ .handle {
  left: 50%;
}

/* 55% */
#p55:checked ~ .after {
  width: 55%;
}
#p55:checked ~ .handle {
  left: 55%;
}

/* 60% */
#p60:checked ~ .after {
  width: 60%;
}
#p60:checked ~ .handle {
  left: 60%;
}

/* 65% */
#p65:checked ~ .after {
  width: 65%;
}
#p65:checked ~ .handle {
  left: 65%;
}

/* 70% */
#p70:checked ~ .after {
  width: 70%;
}
#p70:checked ~ .handle {
  left: 70%;
}

/* 75% */
#p75:checked ~ .after {
  width: 75%;
}
#p75:checked ~ .handle {
  left: 75%;
}

/* 80% */
#p80:checked ~ .after {
  width: 80%;
}
#p80:checked ~ .handle {
  left: 80%;
}

/* 85% */
#p85:checked ~ .after {
  width: 85%;
}
#p85:checked ~ .handle {
  left: 85%;
}

/* 90% */
#p90:checked ~ .after {
  width: 90%;
}
#p90:checked ~ .handle {
  left: 90%;
}

/* 95% */
#p95:checked ~ .after {
  width: 95%;
}
#p95:checked ~ .handle {
  left: 95%;
}

/* 100% */
#p100:checked ~ .after {
  width: 100%;
}
#p100:checked ~ .handle {
  left: 100%;
}

/* кнопки-положения */
.buttons {
  position: absolute;
  inset: 0;
  z-index: 10;
}

.buttons label {
  position: absolute;
  top: 0;
  height: 100%;
  width: 5%;
  cursor: ew-resize;
}

.b10  { left: 7.5%; }
.b15  { left: 12.5%; }
.b20  { left: 17.5%; }
.b25  { left: 22.5%; }
.b30  { left: 27.5%; }
.b35  { left: 32.5%; }
.b40  { left: 37.5%; }
.b45  { left: 42.5%; }
.b50  { left: 47.5%; }
.b55  { left: 52.5%; }
.b60  { left: 57.5%; }
.b65  { left: 62.5%; }
.b70  { left: 67.5%; }
.b75  { left: 72.5%; }
.b80  { left: 77.5%; }
.b85  { left: 82.5%; }
.b90  { left: 87.5%; }
.b95  { left: 92.5%; }
.b100 { left: 97.5%; }
</style>
</head>

<body>

<div class="slider">

  <img src="original.png" alt="">

  <input type="radio" name="position" id="p10" checked>
  <input type="radio" name="position" id="p15">
  <input type="radio" name="position" id="p20">
  <input type="radio" name="position" id="p25">
  <input type="radio" name="position" id="p30">
  <input type="radio" name="position" id="p35">
  <input type="radio" name="position" id="p40">
  <input type="radio" name="position" id="p45">
  <input type="radio" name="position" id="p50">
  <input type="radio" name="position" id="p55">
  <input type="radio" name="position" id="p60">
  <input type="radio" name="position" id="p65">

  <div class="after">

  <div class="buttons">
    <label for="p10" class="b10"></label>

    <label for="p35" class="b35"></label>
    <label for="p40" class="b40"></label>
    <label for="p45" class="b45"></label>
    <label for="p50" class="b50"></label>
    <label for="p55" class="b55"></label>
    <label for="p60" class="b60"></label>
    <label for="p65" class="b65"></label>
    <label for="p70" class="b70"></label>
    <label for="p75" class="b75"></label>
    <label for="p80" class="b80"></label>
    <label for="p85" class="b85"></label>
    <label for="p90" class="b90"></label>
    <label for="p95" class="b95"></label>
    <label for="p100" class="b100"></label>
  </div>

</div>

</body>
</html>
